<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password – TravelFusion AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=1.3">
    <style>
        body { margin: 0; padding: 0; background-color: #05091a; }
        .forgot-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .forgot-box {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 50px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }
    </style>
</head>
<body>

<div class="forgot-wrapper">
    <div class="forgot-box">
        <!-- Decor -->
        <div style="position:absolute;top:-50px;left:-50px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,0.15),transparent);pointer-events:none;"></div>
        
        <div class="text-center mb-4 pb-2">
            <div style="display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:16px;background:rgba(59,130,246,0.1);color:var(--accent-blue);font-size:2rem;margin-bottom:20px;">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h2 style="font-size:1.8rem; font-weight:800; color:white; font-family:'Outfit',sans-serif;">Reset Password</h2>
            <p class="text-muted" style="font-size:0.9rem;">Enter your email address and we'll send you a link to reset your password.</p>
        </div>

        {% if context.get('success') %}
        <div class="alert-glass alert-glass-success mb-4 text-center" role="alert">
            <i class="bi bi-check-circle-fill d-block mb-2" style="font-size:1.5rem;"></i>
            <span>{{ context.get('success') }}</span>
        </div>
        <div class="text-center">
            <a href="/login" class="btn btn-glow w-100 py-3 mt-2">Return to Login</a>
        </div>
        {% else %}
        <form action="/forgot-password" method="POST" id="forgotForm">
            <div class="mb-4">
                <label class="form-label text-muted" style="font-size:.75rem;font-weight:700;text-transform:uppercase;">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                    <input type="email" name="email" class="form-control form-glass" placeholder="you@example.com" required>
                </div>
            </div>

            <button type="submit" class="btn btn-glow w-100 py-3" id="forgotBtn">Send Reset Link</button>
        </form>
        
        <div class="text-center mt-4 pt-3" style="border-top: 1px solid rgba(255,255,255,0.05);">
            <a href="/login" class="text-muted text-decoration-none" style="font-size:.85rem;">
                <i class="bi bi-arrow-left me-1"></i> Back to Login
            </a>
        </div>
        {% endif %}
    </div>
</div>

<script>
    const form = document.getElementById('forgotForm');
    if (form) {
        form.addEventListener('submit', function() {
            const btn = document.getElementById('forgotBtn');
            setTimeout(() => {
                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Sending...';
                btn.disabled = true;
            }, 10);
        });
    }
</script>
</body>
</html>
